interface:
  display_name: "Matzip Review"
  short_description: "Run persona-based matzip reviews into Notion"
  default_prompt: "Use $matzip-review to review this matzip change with the right personas and summarize the decisions in Notion."

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Create review summaries and follow-up tasks."
    - type: "mcp"
      value: "github"
      description: "Read PR metadata and comments when a PR is reviewed."

policy:
  allow_implicit_invocation: true
